<!DOCTYPE html>
<html lang="uk">
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#121211">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    
    <title>BEND IT⚡️</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1R9B204RWW"></script>
    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx1-WnxYagJAvJGzabxFzfxjOH0qdicOzsgm08JCqcV03XPPR1NRRQ6urrojdEaeauJ/exec";

        function sendAnalytics(eventName, extraInfo = "") {
            let tg = window.Telegram.WebApp;
            let user = tg.initDataUnsafe?.user;
            let userId = user ? user.id : "No ID";
            let username = user ? (user.username ? "@" + user.username : user.first_name) : "Web Browser";
            let platform = tg.platform || "Unknown"; 
            let lang = (typeof currentLang !== 'undefined') ? currentLang : 'ua';

            let payload = {
                userId: userId, username: username, event: eventName,
                platform: platform, language: lang, extraData: extraInfo
            };

            fetch(GOOGLE_SCRIPT_URL, {
                method: "POST", mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            }).catch(err => console.error("Analytics error:", err));
        }

        window.onload = function() {
            if (window.Telegram && window.Telegram.WebApp) { window.Telegram.WebApp.expand(); }
            sendAnalytics("App_Opened");
        };

        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date()); gtag('config', 'G-1R9B204RWW');
    </script>
    <style>
        :root {
            --bg-main: #121211; --bg-sec: #1e1e1e;
            --primary: #ff3333; --primary-hover: #cc0000;
            --text-main: #ffffff; --border: #333; --highlight: #4da6ff;
        }
        body.theme-orange { --primary: #ff8c00; --primary-hover: #e07b00; --highlight: #ffb84d; }
        body.theme-blue { --primary: #0077ff; --primary-hover: #005ce6; --highlight: #00d4ff; }

        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-main); color: var(--text-main); padding: 20px; margin: 0; }
        .logo-container { display: flex; justify-content: center; margin-bottom: 10px; }
        .logo-container img { max-width: 300px; height: auto; border-radius: 45px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; position: relative; width: 100%; }
        .left-controls { display: flex; gap: 8px; z-index: 2; }
        .right-controls { display: flex; gap: 8px; z-index: 2; }
        h2 { color: #B04D3A; margin: 0; text-transform: uppercase; letter-spacing: 1px; font-style: italic; font-size: 22px; position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap; z-index: 1; }
        
        .icon-btn, .lang-btn { background-color: #333; color: #fff; border: 1px solid #555; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; display: flex; align-items: center; justify-content: center; min-width: 44px;}
        #wakeLockBtn { opacity: 0.4; transition: opacity 0.3s; }
        #wakeLockBtn.active { opacity: 1; background-color: #444; border-color: #ffd700; box-shadow: 0 0 10px rgba(255, 215, 0, 0.3); }

        /* BEND TABS (QUICK CALCULATE) */
        .bend-tabs-container { display: flex; overflow-x: auto; gap: 10px; padding-bottom: 10px; margin-bottom: 10px; scrollbar-width: none; }
        .bend-tabs-container::-webkit-scrollbar { display: none; }
        .bend-tab { background-color: var(--bg-sec); border: 1px solid var(--border); color: var(--text-main); padding: 14px 20px; border-radius: 12px; white-space: nowrap; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.2s ease; user-select: none; }
        .bend-tab.active { background-color: var(--primary); border-color: var(--primary); color: white; }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #a0a0a0; font-size: 15px; }
        .input-row { display: flex; gap: 10px; }
        .input-row input { flex: 2; }
        .input-row select { flex: 1; text-align: center; }
        
        select, input { width: 100%; height: 52px; padding: 12px; border: 1px solid var(--border); border-radius: 10px; background-color: var(--bg-sec); color: var(--text-main); font-size: 17px; box-sizing: border-box; outline: none; }
        select:focus, input:focus { border-color: var(--primary); }
        
        .guide-box { background-color: #1a1a2e; border-left: 4px solid var(--highlight); padding: 15px; margin-top: 10px; font-size: 14px; color: #88c0d0; border-radius: 0 10px 10px 0; box-sizing: border-box; line-height: 1.4; }
        
        .guide-action-btns { display: flex; gap: 10px; margin-top: 15px; margin-bottom: 20px; }
        .guide-action-btns button { flex: 1; height: 52px; background: #222; border: 1px solid var(--highlight); color: var(--highlight); border-radius: 10px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 15px; }
        .guide-action-btns button:active { background: var(--highlight); color: #000; }

        button.calc-btn { width: 100%; height: 60px; background-color: var(--primary); color: white; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; margin-top: 10px; cursor: pointer; text-transform: uppercase; transition: background-color 0.2s; }
        button.calc-btn:active { background-color: var(--primary-hover); }
        
        .result-box { margin-top: 20px; padding: 20px; background-color: var(--bg-sec); border: 1px solid var(--border); border-radius: 10px; display: none; border-left: 5px solid var(--primary); }
        .result-title { color: var(--primary); font-weight: bold; margin-bottom: 12px; font-size: 20px; }
        .mark { font-size: 20px; margin-bottom: 10px; padding: 8px 0; border-bottom: 1px solid #2a2a2a; }
        .info { color: #a0a0a0; font-size: 15px; margin-top: 12px; padding-top: 12px; line-height: 1.5; }
        .highlight { color: var(--highlight); font-weight: bold; }
        .limit-warning { color: #ff9900; font-weight: bold; margin-top: 15px; display: block; border-top: 1px dashed #ff9900; padding-top: 10px; }

        .action-buttons-row { display: flex; gap: 10px; margin-top: 20px; }
        .action-buttons-row button { flex: 1; font-size: 16px; margin-top: 0; }
        #btnShare { background-color: #0088cc; } #btnShare:active { background-color: #006699; }
        #btnCopy { background-color: #444; } #btnCopy:active { background-color: #333; }

        /* CHEAT SHEET TABLE */
        .cheat-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .cheat-table th, .cheat-table td { padding: 12px 8px; text-align: left; border-bottom: 1px solid #333; font-size: 15px; }
        .cheat-table th { color: var(--highlight); font-weight: normal; border-bottom: 2px solid #444; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); overflow: auto; }
        .modal-content { background-color: var(--bg-sec); margin: 80px auto 20px; padding: 20px; border: 1px solid #444; border-radius: 14px; width: 92%; max-width: 500px; position: relative; color: white; box-sizing: border-box; }
        .close-modal { position: absolute; right: 15px; top: 15px; width: 40px; height: 40px; background-color: #333; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; cursor: pointer; z-index: 10; }
        .close-modal:active { background-color: var(--primary); }
        .modal h3 { margin-top: 0; color: var(--highlight); padding-right: 45px; font-size: 20px; margin-bottom: 20px; }
        
        .slider-img { width: 100%; height: auto; border-radius: 10px; margin-top: 15px; border: 1px solid var(--border); }
        .slider-text { font-size: 16px; color: #ddd; margin-top: 15px; line-height: 1.5; min-height: 50px; }
        
        .slider-controls { display: flex; justify-content: space-between; align-items: center; margin-top: 25px; }
        .slider-btn { background: var(--primary); border: none; color: white; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; }
        .slider-btn:active { background: var(--primary-hover); }
        .slider-btn:disabled { background: #555; color: #888; cursor: not-allowed; }
        .slide-counter { font-weight: bold; color: #aaa; font-size: 16px; }

        .marker-tabs { display: flex; gap: 8px; margin-top: 15px; }
        .marker-tabs button { flex: 1; padding: 14px 5px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; }
        .marker-tabs button.active { background: var(--primary); border-color: var(--primary); }
    </style>
</head>
<body>

    <div class="logo-container"><img src="https://i.imgur.com/vUB7xdz.png" alt="Logo"></div>
    
    <div class="header">
        <div class="left-controls">
            <button class="icon-btn" id="wakeLockBtn" onclick="toggleWakeLock()" title="Keep Screen On">💡</button>
            <button class="icon-btn" id="fracBtn" onclick="openFracCalc()" title="Fraction Calculator">🧮</button>
            <button class="icon-btn" onclick="openFillCalc()" title="Conduit Fill Calculator">📊</button>
            <button class="icon-btn" onclick="openCheatSheet()" title="Cheat Sheet">📋</button>
        </div>
        <h2>BEND IT⚡️</h2>
        <div class="right-controls">
            <button class="icon-btn" id="themeBtn" onclick="cycleTheme()" title="Change Theme">🔴</button>
            <button class="lang-btn" id="langBtn" onclick="toggleLang()">UA</button>
        </div>
    </div>

    <!-- ГОРИЗОНТАЛЬНЫЕ КНОПКИ ДЛЯ ВЫБОРА ГИБА (Заменили select) -->
    <div id="bendTabs" class="bend-tabs-container"></div>
    <!-- Скрытый select для сохранения логики работы формы -->
    <select id="bendType" style="display: none;" onchange="updateUI()"></select>

    <div class="form-group" id="conduitSizeGroup"><label id="lblSize">Conduit Size (EMT)</label><select id="conduitSize"></select></div>
    <div class="form-group" id="angleGroup"><label id="lblAngle">Bend Angle</label><select id="bendAngle"></select></div>
    
    <div class="form-group" id="pipesGroup" style="display: none;"><label id="lblPipes">Number of Pipes</label><select id="pipeCount"><option value="2">2 Pipes</option><option value="3">3 Pipes</option><option value="4">4 Pipes</option></select></div>
    <div class="form-group" id="bendsCountGroup" style="display: none;"><label id="lblBends">Number of Bends</label><select id="bendsCount"><option value="9">9 Bends</option><option value="15">15 Bends</option><option value="18">18 Bends</option></select></div>
    <div class="form-group" id="spacingGroup" style="display: none;"><label id="lblSpacing">Pipe Spacing</label><div class="input-row"><input type="number" id="spacingWhole" value="1"><select id="spacingFrac" class="frac-select"></select></div></div>
    <div class="form-group" id="distanceGroup"><label id="lblDist">Distance</label><div class="input-row"><input type="number" id="distanceWhole"><select id="distanceFrac" class="frac-select"></select></div></div>
    <div class="form-group" id="heightGroup"><label id="lblHeight">Rise</label><div class="input-row"><input type="number" id="heightWhole"><select id="heightFrac" class="frac-select"></select></div></div>
    <div class="form-group" id="widthGroup" style="display: none;"><label id="lblWidth">Obstacle Width</label><div class="input-row"><input type="number" id="widthWhole"><select id="widthFrac" class="frac-select"></select></div></div>
    <div class="form-group" id="shiftGroup" style="display: none;"><label id="lblShift">Horizontal Shift</label><div class="input-row"><input type="number" id="shiftWhole"><select id="shiftFrac" class="frac-select"></select></div></div>

    <div class="guide-box" id="guideText"></div>

    <div class="guide-action-btns">
        <button id="btnPhotoGuide" onclick="openPhotoGuide()">📸 Фото-Гайд</button>
        <button id="btnBenderMarks" onclick="openBenderMarks()">🔍 Значки трубогиба</button>
    </div>

    <button class="calc-btn" id="btnCalc" onclick="calculate()">Calculate</button>

    <div class="result-box" id="resultBox">
        <div class="result-title" id="resTitle">Layout Marks:</div>
        <div id="marks"></div>
        <div class="info" id="extraInfo"></div>
        
        <div class="action-buttons-row">
            <button id="btnCopy" class="calc-btn" onclick="copyResults()">📋 Копіювати</button>
            <button id="btnShare" class="calc-btn" onclick="shareToTelegram()">✈️ В чат</button>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ФОТО-ГАЙДА -->
    <div id="modalOverlay" class="modal" onclick="closeModalOutside(event, 'modalOverlay')">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('modalOverlay')">&times;</span>
            <h3 id="modalTitle">Guide</h3>
            <div id="markerTabsContainer" class="marker-tabs" style="display: none;">
                <button id="tabArrow" onclick="switchMarker('arrow')">➔ Стрілка</button>
                <button id="tabStar" onclick="switchMarker('star')">★ Зірка</button>
                <button id="tabNotch" onclick="switchMarker('notch')">⯎ Насічка</button>
            </div>
            <img id="modalImg" class="slider-img" src="" alt="Guide Image">
            <div id="modalText" class="slider-text">Текст шага</div>
            <div id="sliderControls" class="slider-controls">
                <button id="btnPrev" class="slider-btn" onclick="changeSlide(-1)">❮ Prev</button>
                <span id="slideCounter" class="slide-counter">1 / 1</span>
                <button id="btnNext" class="slider-btn" onclick="changeSlide(1)">Next ❯</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ДЛЯ ДРОБЕЙ -->
    <div id="fracModal" class="modal" onclick="closeModalOutside(event, 'fracModal')">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('fracModal')">&times;</span>
            <h3 id="fracTitle">📏 Калькулятор дробів</h3>
            
            <div class="form-group">
                <div class="input-row">
                    <input type="number" id="f1Whole" placeholder="Ціле (Whole)">
                    <select id="f1Frac" class="frac-select"></select>
                </div>
            </div>
            
            <div class="form-group" style="text-align: center;">
                <select id="fOp" style="width: 80px; display: inline-block; font-size: 24px; font-weight: bold;">
                    <option value="+">+</option>
                    <option value="-">-</option>
                </select>
            </div>

            <div class="form-group">
                <div class="input-row">
                    <input type="number" id="f2Whole" placeholder="Ціле (Whole)">
                    <select id="f2Frac" class="frac-select"></select>
                </div>
            </div>

            <button class="calc-btn" id="btnFracCalc" onclick="calcFractionResult()">Рахувати</button>
            
            <div class="result-box" id="fracResultBox" style="display: none; border-left-color: #4da6ff; margin-top: 15px; padding: 15px;">
                <div class="mark" style="text-align: center; font-size: 26px; color: #4da6ff; border-bottom: none; margin: 0;" id="fracResText">0"</div>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО CONDUIT FILL (CEC) -->
    <div id="fillModal" class="modal" onclick="closeModalOutside(event, 'fillModal')">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('fillModal')">&times;</span>
            <h3 id="fillTitle">📊 Заповнення труби (CEC)</h3>
            
            <div class="form-group">
                <label id="lblFillSize">Розмір труби (EMT)</label>
                <select id="fillConduitSize" onchange="calcFill()">
                    <option value="16">1/2"</option>
                    <option value="21">3/4"</option>
                    <option value="27">1"</option>
                </select>
            </div>
            
            <label id="lblWire1" style="color:#fff; margin-bottom:10px;">Провід 1 (Тип/Переріз):</label>
            <div class="input-row" style="margin-bottom: 15px;">
                <select id="wireType1" onchange="calcFill()">
                    <option value="t90">T90 (Nylon)</option>
                    <option value="rw90">RW90 (XLPE)</option>
                </select>
                <select id="wireAwg1" onchange="calcFill()">
                    <option value="14">#14 AWG</option>
                    <option value="12" selected>#12 AWG</option>
                    <option value="10">#10 AWG</option>
                    <option value="8">#8 AWG</option>
                </select>
                <input type="number" id="wireQty1" placeholder="Шт" value="0" min="0" oninput="calcFill()" style="width: 60px; flex: none;">
            </div>

            <label id="lblWire2" style="color:#fff; margin-bottom:10px;">Провід 2 (Додатково):</label>
            <div class="input-row" style="margin-bottom: 20px;">
                <select id="wireType2" onchange="calcFill()">
                    <option value="t90">T90 (Nylon)</option>
                    <option value="rw90">RW90 (XLPE)</option>
                </select>
                <select id="wireAwg2" onchange="calcFill()">
                    <option value="14">#14 AWG</option>
                    <option value="12">#12 AWG</option>
                    <option value="10">#10 AWG</option>
                    <option value="8">#8 AWG</option>
                </select>
                <input type="number" id="wireQty2" placeholder="Шт" value="0" min="0" oninput="calcFill()" style="width: 60px; flex: none;">
            </div>

            <div style="padding: 15px; background: #2a2a2a; border-radius: 8px; text-align: center;">
                <div style="font-size: 14px; color: #a0a0a0; margin-bottom: 10px;">
                    <span id="lblOccupied">Зайнято:</span> <span id="fillAreaText">0</span> / <span id="maxAreaText">0</span> мм² 
                    <br><span style="font-size: 12px;">(<span id="lblLimit">Ліміт за CEC Table 8:</span> <span id="limitPctText">40</span>%)</span>
                </div>
                <div style="width: 100%; background: #111; height: 16px; border-radius: 8px; overflow: hidden; margin-bottom: 10px; border: 1px solid #444;">
                    <div id="fillBar" style="height: 100%; width: 0%; background: #4da6ff; transition: width 0.3s, background 0.3s;"></div>
                </div>
                <div id="fillStatus" style="font-size: 18px; font-weight: bold; color: #4da6ff;">Введіть кількість</div>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ШПАРГАЛКИ (CHEAT SHEET) -->
    <div id="cheatModal" class="modal" onclick="closeModalOutside(event, 'cheatModal')">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal
