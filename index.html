<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEND IT⚡️</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121211;
            color: #ffffff;
            padding: 20px;
            margin: 0;
        }
        .logo-container {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }
        .logo-container img {
            max-width: 300px;
            height: auto;
            border-radius: 45px;
            box-shadow: 0 0px 0px rgba(0,0,0,0.0);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            position: relative;
        }
        h2 {
            color: #B04D3A;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-style: italic;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
        }
        .lang-btn {
            margin-left: auto;
            z-index: 1;
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #a0a0a0;
            font-size: 14px;
        }
        .input-row {
            display: flex;
            gap: 10px;
        }
        .input-row input {
            flex: 2;
        }
        .input-row select {
            flex: 1;
            text-align: center;
        }
        select, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 8px;
            background-color: #1e1e1e;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
        }
        .guide-box {
            background-color: #1a1a2e;
            border-left: 3px solid #4da6ff;
            padding: 12px;
            margin-top: 10px;
            margin-bottom: 15px;
            font-size: 13px;
            color: #88c0d0;
            border-radius: 0 8px 8px 0;
            box-sizing: border-box;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        button.calc-btn {
            width: 100%;
            padding: 15px;
            background-color: #ff3333;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
            text-transform: uppercase;
        }
        button.calc-btn:active {
            background-color: #cc0000;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            display: none;
            border-left: 4px solid #ff3333;
        }
        .result-title {
            color: #ff3333;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 18px;
        }
        .mark {
            font-size: 18px;
            margin-bottom: 8px;
            padding: 6px 0;
            border-bottom: 1px solid #2a2a2a;
        }
        .info {
            color: #a0a0a0;
            font-size: 14px;
            margin-top: 10px;
            padding-top: 10px;
            line-height: 1.5;
        }
        .highlight { color: #4da6ff; font-weight: bold; }
        .limit-warning { color: #ff9900; font-weight: bold; margin-top: 15px; display: block; border-top: 1px dashed #ff9900; padding-top: 10px; }
    </style>
</head>
<body>

    <div class="logo-container">
        <img src="https://i.imgur.com/vUB7xdz.png" alt="Logo">
    </div>

    <div class="header">
        <h2>BEND IT⚡️</h2>
        <button class="lang-btn" id="langBtn" onclick="toggleLang()">UA</button>
    </div>

    <div class="form-group">
        <label id="lblType">Bend Type</label>
        <select id="bendType" onchange="updateUI()"></select>
    </div>

    <div class="form-group" id="conduitSizeGroup">
        <label id="lblSize">Conduit Size (Take-up)</label>
        <select id="conduitSize"></select>
    </div>

    <div class="form-group" id="angleGroup">
        <label id="lblAngle">Bend Angle</label>
        <select id="bendAngle"></select>
    </div>

    <div class="form-group" id="pipesGroup" style="display: none;">
        <label id="lblPipes">Number of Pipes (Кількість труб)</label>
        <select id="pipeCount">
            <option value="2">2 Pipes</option>
            <option value="3">3 Pipes</option>
            <option value="4">4 Pipes</option>
        </select>
    </div>
    
    <div class="form-group" id="bendsCountGroup" style="display: none;">
        <label id="lblBends">Number of Bends (Кількість дрібних вигинів)</label>
        <select id="bendsCount">
            <option value="9">9 Bends (10° each)</option>
            <option value="15">15 Bends (6° each)</option>
            <option value="18">18 Bends (5° each)</option>
        </select>
    </div>

    <div class="form-group" id="spacingGroup" style="display: none;">
        <label id="lblSpacing">Pipe Spacing (Відстань між осями труб)</label>
        <div class="input-row">
            <input type="number" id="spacingWhole" value="1" placeholder="1">
            <select id="spacingFrac" class="frac-select"></select>
        </div>
    </div>

    <div class="form-group">
        <label id="lblDist">Distance</label>
        <div class="input-row">
            <input type="number" id="distanceWhole" placeholder="e.g., 20">
            <select id="distanceFrac" class="frac-select"></select>
        </div>
    </div>

    <div class="form-group" id="heightGroup">
        <label id="lblHeight">Rise (Obstacle Height)</label>
        <div class="input-row">
            <input type="number" id="heightWhole" placeholder="e.g., 4">
            <select id="heightFrac" class="frac-select"></select>
        </div>
    </div>

    <div class="form-group" id="widthGroup" style="display: none;">
        <label id="lblWidth">Obstacle Width</label>
        <div class="input-row">
            <input type="number" id="widthWhole" placeholder="e.g., 10">
            <select id="widthFrac" class="frac-select"></select>
        </div>
    </div>

    <div class="form-group" id="shiftGroup" style="display: none;">
        <label id="lblShift">Horizontal Shift (Roll)</label>
        <div class="input-row">
            <input type="number" id="shiftWhole" placeholder="e.g., 3">
            <select id="shiftFrac" class="frac-select"></select>
        </div>
    </div>

    <div class="guide-box" id="guideText"></div>

    <button class="calc-btn" id="btnCalc" onclick="calculate()">Calculate</button>

    <div class="result-box" id="resultBox">
        <div class="result-title" id="resTitle">Layout Marks:</div>
        <div id="marks"></div>
        <div class="info" id="extraInfo"></div>
    </div>

        ];

        function toggleLang() {
            if (currentLang === 'ua') currentLang = 'ru';
            else if (currentLang === 'ru') currentLang = 'en';
            else currentLang = 'ua';

            document.getElementById('langBtn').innerText = dict[currentLang].btnText;
            initDropdowns();
            updateUI();
            document.getElementById('resultBox').style.display = 'none';
        }

        function initDropdowns() {
            const typeSel = document.getElementById('bendType');
            const prevType = typeSel.value;
            typeSel.innerHTML = '';
            for (const [key, val] of Object.entries(dict[currentLang].types)) {
                typeSel.add(new Option(val, key));
            }
            if (prevType && dict[currentLang].types[prevType]) typeSel.value = prevType;

            const sizeSel = document.getElementById('conduitSize');
            sizeSel.innerHTML = '';
            for (const [key, val] of Object.entries(dict[currentLang].sizes)) {
                sizeSel.add(new Option(val, key));
            }
            sizeSel.value = "6";
            
            document.querySelectorAll('.frac-select').forEach(sel => {
                const prev = sel.value;
                sel.innerHTML = '';
                fracOptions.forEach(f => sel.add(new Option(f.t, f.v)));
                if(prev) sel.value = prev;
            });

            document.getElementById('lblType').innerText = dict[currentLang].typeLabel;
            document.getElementById('lblSize').innerText = dict[currentLang].sizeLabel;
            document.getElementById('lblAngle').innerText = dict[currentLang].angleLabel;
            document.getElementById('btnCalc').innerText = dict[currentLang].btnCalc;
            document.getElementById('resTitle').innerText = dict[currentLang].resTitle;
            document.getElementById('lblHeight').innerText = dict[currentLang].lblHeight;
            document.getElementById('lblWidth').innerText = dict[currentLang].lblWidth;
            document.getElementById('lblShift').innerText = dict[currentLang].lblShift;
            document.getElementById('lblPipes').innerText = dict[currentLang].lblPipes;
            document.getElementById('lblSpacing').innerText = dict[currentLang].lblSpacing;
            document.getElementById('lblBends').innerText = dict[currentLang].lblBends;
        }

        function updateUI() {
            const type = document.getElementById('bendType').value;
            const angleSel = document.getElementById('bendAngle');
            const dLabel = document.getElementById('lblDist');
            const guide = document.getElementById('guideText');
            const t = dict[currentLang];
            
            document.getElementById('conduitSizeGroup').style.display = (type === 'stub90' || type === 'backToBack') ? 'block' : 'none';
            document.getElementById('angleGroup').style.display = (type === 'stub90' || type === 'backToBack' || type === 'concentric') ? 'none' : 'block';
            document.getElementById('heightGroup').style.display = (type === 'stub90' || type === 'backToBack' || type === 'concentric') ? 'none' : 'block';
            document.getElementById('widthGroup').style.display = (type === 'saddle4') ? 'block' : 'none';
            document.getElementById('shiftGroup').style.display = (type === 'rolling') ? 'block' : 'none';
            document.getElementById('bendsCountGroup').style.display = (type === 'concentric') ? 'block' : 'none';
            
            const isParallel = (type === 'parallelOffset');
            document.getElementById('pipesGroup').style.display = isParallel ? 'block' : 'none';
            document.getElementById('spacingGroup').style.display = isParallel ? 'block' : 'none';

            angleSel.innerHTML = '';

            if (type === 'stub90') {
                dLabel.innerText = t.lblDistStub;
                guide.innerHTML = t.guideStub;
            } else if (type === 'backToBack') {
                dLabel.innerText = t.lblDistB2B;
                guide.innerHTML = t.guideB2B;
            } else if (type === 'concentric') {
                dLabel.innerText = t.lblDistRadius;
                guide.innerHTML = t.guideConcentric;
            } else if (type === 'offset' || type === 'rolling' || type === 'saddle4' || type === 'parallelOffset') {
                dLabel.innerText = t.lblDistStart;
                guide.innerHTML = (type === 'offset') ? t.guideOffset : (type === 'rolling' ? t.guideRolling : (type === 'parallelOffset' ? t.guideParallel : t.guideSaddle4));
                
                for (const [key, val] of Object.entries(t.anglesOffset)) {
                    angleSel.add(new Option(val, key));
                }
                angleSel.value = "30";
            } else if (type === 'saddle3') {
                dLabel.innerText = t.lblDistCenter;
                guide.innerHTML = t.guideSaddle3;
                
                for (const [key, val] of Object.entries(t.anglesSaddle)) {
                    angleSel.add(new Option(val, key));
                }
                angleSel.value = "30";
            }
        }

        function getFullVal(idPrefix) {
            let w = parseFloat(document.getElementById(idPrefix + 'Whole').value) || 0;
            let f = parseFloat(document.getElementById(idPrefix + 'Frac').value) || 0;
            return w > 0 || f > 0 ? w + f : 0;
        }

        function toFraction(decimal) {
            if (isNaN(decimal) || decimal === 0) return "0";
            let whole = Math.floor(decimal);
            let frac = decimal - whole;
            let sixteenths = Math.round(frac * 16);
            if (sixteenths === 0) return whole.toString() + '"';
            if (sixteenths === 16) return (whole + 1).toString() + '"';
            let num = sixteenths, den = 16;
            while (num % 2 === 0 && den % 2 === 0) { num /= 2; den /= 2; }
            let fracStr = num + '/' + den;
            return whole > 0 ? whole + ' ' + fracStr + '"' : fracStr + '"';
        }

        function calculate() {
            const type = document.getElementById('bendType').value;
            const dist = getFullVal('distance');
            const t = dict[currentLang];
            
            if (!dist) { alert("Distance/Radius required!"); return; }

            let resHTML = "", infoHTML = "";
            let maxMark = 0; // Переменная для проверки лимита 120"

            if (type === 'stub90') {
                const takeup = parseFloat(document.getElementById('conduitSize').value);
                let mark = dist - takeup;
                resHTML = `<div class="mark"><span class="highlight">Mark:</span> ${toFraction(mark)}</div>`;
                infoHTML = t.tipStub;
                maxMark = dist;
            } else if (type === 'backToBack') {
                const takeup = parseFloat(document.getElementById('conduitSize').value);
                let m1 = dist - takeup;
                let m2 = dist;
                resHTML = `
                    <div class="mark"><span class="highlight">M1 (Arrow / ➔):</span> ${toFraction(m1)}</div>
                    <div class="mark"><span class="highlight">M2 (Star / ★):</span> ${toFraction(m2)}</div>
                `;
                infoHTML = t.tipB2B;
                maxMark = dist;
            } else if (type === 'concentric') {
                let radius = dist;
                let bends = parseInt(document.getElementById('bendsCount').value);
                
                // Формула длины дуги: L = R * 1.57 (Пи/2 для 90 градусов)
                let devLength = radius * 1.5708;
                let spacing = devLength / bends;
                let degPerBend = 90 / bends;
                let sideMarks = (bends - 1) / 2;

                resHTML = `
                    <div class="mark"><span class="highlight">${t.spacing}:</span> ${toFraction(spacing)}</div>
                    <div class="mark"><span class="highlight">Angle:</span> ${degPerBend}° per bend</div>
                `;
                infoHTML = `<b>Всього міток:</b> ${bends} (1 Центр + по ${sideMarks} шт в обидва боки від центру)<br><br>${t.tipConcentric}`;
                maxMark = devLength; 
            } else {
                let h = getFullVal('height');
                if (!h) { alert("Rise height required!"); return; }
                
                const angle = parseFloat(document.getElementById('bendAngle').value);
                let shrinkPerInch = 0, multiplier = 0;

                if (type === 'rolling') {
                    let shift = getFullVal('shift');
                    if (!shift) { alert("Roll shift required!"); return; }
                    h = Math.sqrt((h * h) + (shift * shift)); 
                    infoHTML = `<b>${t.trueOffset}: ${toFraction(h)}</b><br>`;
                }

                if (angle === 10) { shrinkPerInch = 1/16; multiplier = 6.0; }
                if (angle === 22.5) { shrinkPerInch = 3/16; multiplier = (type === 'saddle3' ? 2.5 : 2.6); }
                if (angle === 30) { shrinkPerInch = 1/4; multiplier = 2.0; }
                if (angle === 45) { shrinkPerInch = 3/8; multiplier = 1.4; }

                let shrink = h * shrinkPerInch;
                let step = h * multiplier;

                if (type === 'offset' || type === 'rolling') {
                    let m1 = dist + shrink;
                    let m2 = m1 + step;
                    resHTML = `
                        <div class="mark"><span class="highlight">M1:</span> ${toFraction(m1)} ${t.markStart}</div>
                        <div class="mark"><span class="highlight">M2:</span> ${toFraction(m2)} ${t.markEnd}</div>
                    `;
                    infoHTML += `<b>${t.shrink}:</b> ${toFraction(shrink)} <br><b>${t.spacing}:</b> ${toFraction(step)}<br><br>${t.tipOffset}`;
                    maxMark = m2;
                } else if (type === 'parallelOffset') {
                    let count = parseInt(document.getElementById('pipeCount').value) || 2;
                    let spacing = getFullVal('spacing') || 1;
                    let baseM1 = dist + shrink;
                    let baseM2 = baseM1 + step;

                    let angleRad = (angle * Math.PI) / 180;
                    let stagger = spacing * Math.tan(angleRad / 2);

                    infoHTML += `<b>${t.shrink}:</b> ${toFraction(shrink)} <br><b>Stagger:</b> ${toFraction(stagger)}<br><br>${t.tipParallel}`;
                    
                    for (let i = 0; i < count; i++) {
                        let shiftAmount = i * stagger;
                        let piM1 = baseM1 + shiftAmount;
                        let piM2 = baseM2 + shiftAmount;
                        resHTML += `
                            <div class="mark">
                                <span class="highlight">Pipe ${i+1}:</span> M1: ${toFraction(piM1)} | M2: ${toFraction(piM2)}
                            </div>
                        `;
                        maxMark = piM2; // Последняя труба даст максимальную метку
                    }
                } else if (type === 'saddle3') {
                    let m2 = dist + shrink;
                    let m1 = m2 - step;
                    let m3 = m2 + step;
                    resHTML = `
                        <div class="mark"><span class="highlight">M1:</span> ${toFraction(m1)} ${t.markSide}</div>
                        <div class="mark" style="color:#ff3333;"><b>M2: ${toFraction(m2)} ${t.markCenter}</b></div>
                        <div class="mark"><span class="highlight">M3:</span> ${toFraction(m3)} ${t.markSide}</div>
                    `;
                    infoHTML += `<b>${t.shrink}:</b> ${toFraction(shrink)} <br><b>${t.spacing}:</b> ${toFraction(step)}<br><br>${t.tipSaddle3}`;
                    maxMark = m3;
                } else if (type === 'saddle4') {
                    let w = getFullVal('width');
                    if (!w) { alert("Obstacle width required!"); return; }
                    let m2 = dist + shrink, m1 = m2 - step, m3 = m2 + w, m4 = m3 + step;
                    resHTML = `
                        <div class="mark"><span class="highlight">M1:</span> ${toFraction(m1)}</div>
                        <div class="mark"><span class="highlight">M2:</span> ${toFraction(m2)}</div>
                        <div class="mark"><span class="highlight">M3:</span> ${toFraction(m3)}</div>
                        <div class="mark"><span class="highlight">M4:</span> ${toFraction(m4)}</div>
                    `;
                    infoHTML += `<b>${t.shrink}:</b> ${toFraction(shrink)} <br><b>${t.spacing}:</b> ${toFraction(step)}<br><br>${t.tipSaddle4}`;
                    maxMark = m4;
                }
            }

            // Проверка лимита в 120 дюймов (10 футов)
            if (maxMark > 120) {
                infoHTML += `<div class="limit-warning">${t.limitWarn}</div>`;
            }

            document.getElementById('marks').innerHTML = resHTML;
            document.getElementById('extraInfo').innerHTML = infoHTML;
            document.getElementById('resultBox').style.display = 'block';
        }

        initDropdowns();
        updateUI();
    </script>
</body>
