.modal-content {

    font-weight: bold;

    z-index: 10;

        function getFullVal(idPrefix) { let w = parseFloat(document.getElementById(idPrefix + 'Whole').value) || 0; let f = parseFloat(document.getElementById(idPrefix + 'Frac').value) || 0; return w > 0 || f > 0 ? w + f : 0; }
        function toFraction(decimal) {
            if (isNaN(decimal) || decimal === 0) return "0";
            let whole = Math.floor(decimal), frac = decimal - whole, sixteenths = Math.round(frac * 16);
            if (sixteenths === 0) return whole.toString() + '"'; if (sixteenths === 16) return (whole + 1).toString() + '"';
            let num = sixteenths, den = 16; while (num % 2 === 0 && den % 2 === 0) { num /= 2; den /= 2; }
            let fracStr = num + '/' + den; return whole > 0 ? whole + ' ' + fracStr + '"' : fracStr + '"';
        }

        function calculate() {
            const type = document.getElementById('bendType').value; const dist = getFullVal('distance'); const t = dict[currentLang];
            if (!dist) { alert("Distance/Span required!"); return; }
            let resHTML = "", infoHTML = "", maxMark = 0; 

            if (type === 'stub90') {
                const takeup = parseFloat(document.getElementById('conduitSize').value); let mark = dist - takeup;
                resHTML = `<div class="mark"><span class="highlight">Mark:</span> ${toFraction(mark)}</div>`; infoHTML = t.tipStub; maxMark = dist;
            } else if (type === 'backToBack') {
                const takeup = parseFloat(document.getElementById('conduitSize').value); let m1 = dist - takeup, m2 = dist;
                resHTML = `<div class="mark"><span class="highlight">M1 (Arrow / ➔):</span> ${toFraction(m1)}</div><div class="mark"><span class="highlight">M2 (Star / ★):</span> ${toFraction(m2)}</div>`; infoHTML = t.tipB2B; maxMark = dist;
            } else if (type === 'fullB2B') {
                const takeup = parseFloat(document.getElementById('conduitSize').value); let stubX = getFullVal('height');
                if (!stubX) { alert("First stub height (X) required!"); return; }
                let m1 = stubX - takeup, m2 = dist - takeup;
                resHTML = `<div class="mark"><span class="highlight">M1 (1st Stub-up):</span> ${toFraction(m1)} (на Стрілці)</div><div class="mark"><span class="highlight">M2 (2nd Back-to-Back):</span> ${toFraction(m2)} (на Стрілці)</div>`; infoHTML = t.tipFullB2B; maxMark = dist;
            } else if (type === 'concentric') {
                let radius = dist, bends = parseInt(document.getElementById('bendsCount').value), devLength = radius * 1.5708, spacing = devLength / bends, degPerBend = 90 / bends, sideMarks = (bends - 1) / 2;
                resHTML = `<div class="mark"><span class="highlight">${t.spacing}:</span> ${toFraction(spacing)}</div><div class="mark"><span class="highlight">Angle:</span> ${degPerBend}° per bend</div>`; infoHTML = `<b>Всього міток:</b> ${bends} (1 Центр + по ${sideMarks} шт в обидва боки від центру)<br><br>${t.tipConcentric}`; maxMark = devLength; 
            } else {
                let h = getFullVal('height'); if (!h) { alert("Rise height required!"); return; }
                const angle = parseFloat(document.getElementById('bendAngle').value); let shrinkPerInch = 0, multiplier = 0;
                if (type === 'rolling') {
                    let shift = getFullVal('shift'); if (!shift) { alert("Roll shift required!"); return; }
                    h = Math.sqrt((h * h) + (shift * shift)); infoHTML = `<b>${t.trueOffset}: ${toFraction(h)}</b><br>`;
                }
                if (angle === 10) { shrinkPerInch = 1/16; multiplier = 6.0; } if (angle === 22.5) { shrinkPerInch = 3/16; multiplier = (type === 'saddle3' ? 2.5 : 2.6); }
                if (angle === 30) { shrinkPerInch = 1/4; multiplier = 2.0; } if (angle === 45) { shrinkPerInch = 3/8; multiplier = 1.4; }

                let shrink = h * shrinkPerInch, step = h * multiplier;

                if (type === 'offset' || type === 'rolling') {
                    let m1 = dist + shrink, m2 = m1 + step;
                    resHTML = `<div class="mark"><span class="highlight">M1:</span> ${toFraction(m1)} ${t.markStart}</div><div class="mark"><span class="highlight">M2:</span> ${toFraction(m2)} ${t.markEnd}</div>`;
                    infoHTML += `<b>${t.shrink}:</b> ${toFraction(shrink)} <br><b>${t.spacing}:</b> ${toFraction(step)}<br><br>${t.tipOffset}`; maxMark = m2;
                } else if (type === 'parallelOffset') {
                    let count = parseInt(document.getElementById('pipeCount').value) || 2, spacing = getFullVal('spacing') || 1, baseM1 = dist + shrink, baseM2 = baseM1 + step, angleRad = (angle * Math.PI) / 180, stagger = spacing * Math.tan(angleRad / 2);
                    infoHTML += `<b>${t.shrink}:</b> ${toFraction(shrink)} <br><b>Stagger:</b> ${toFraction(stagger)}<br><br>${t.tipParallel}`;
                    for (let i = 0; i < count; i++) {
                        let shiftAmount = i * stagger, piM1 = baseM1 + shiftAmount, piM2 = baseM2 + shiftAmount;
                        resHTML += `<div class="mark"><span class="highlight">Pipe ${i+1}:</span> M1: ${toFraction(piM1)} | M2: ${toFraction(piM2)}</div>`; maxMark = piM2;
                    }
                } else if (type === 'saddle3') {
                    let m2 = dist + shrink, m1 = m2 - step, m3 = m2 + step;
                    resHTML = `<div class="mark"><span class="highlight">M1:</span> ${toFraction(m1)} ${t.markSide}</div><div class="mark" style="color:#ff3333;"><b>M2: ${toFraction(m2)} ${t.markCenter}</b></div><div class="mark"><span class="highlight">M3:</span> ${toFraction(m3)} ${t.markSide}</div>`; infoHTML += `<b>${t.shrink}:</b> ${toFraction(shrink)} <br><b>${t.spacing}:</b> ${toFraction(step)}<br><br>${t.tipSaddle3}`; maxMark = m3;
                } else if (type === 'saddle4') {
                    let w = getFullVal('width'); if (!w) { alert("Obstacle width required!"); return; }
                    let m2 = dist + shrink, m1 = m2 - step, m3 = m2 + w, m4 = m3 + step;
                    resHTML = `<div class="mark"><span class="highlight">M1:</span> ${toFraction(m1)}</div><div class="mark"><span class="highlight">M2:</span> ${toFraction(m2)}</div><div class="mark"><span class="highlight">M3:</span> ${toFraction(m3)}</div><div class="mark"><span class="highlight">M4:</span> ${toFraction(m4)}</div>`; infoHTML += `<b>${t.shrink}:</b> ${toFraction(shrink)} <br><b>${t.spacing}:</b> ${toFraction(step)}<br><br>${t.tipSaddle4}`; maxMark = m4;
                }
            }
            if (maxMark > 120) infoHTML += `<div class="limit-warning">${t.limitWarn}</div>`;
            document.getElementById('marks').innerHTML = resHTML; document.getElementById('extraInfo').innerHTML = infoHTML; document.getElementById('resultBox').style.display = 'block';
        }

        initDropdowns(); updateUI();
    </script>
</body>
</html>
